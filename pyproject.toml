[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atk-cli"
version = "0.1.0"
description = "kubectl inspired CLI for America's Test Kitchen API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "jsonpath-ng>=1.6.1",
]

[project.optional-dependencies]
pdf = ["playwright>=1.40.0"]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[project.scripts]
atk = "atk_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/atk_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--tb=short"]

[tool.coverage.run]
source = ["atk_cli"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
