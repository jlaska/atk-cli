[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atk-cli"
version = "0.1.0"
description = "kubectl-inspired CLI for America's Test Kitchen API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "jsonpath-ng>=1.6.1",
]

[project.scripts]
atk = "atk_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/atk_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"
